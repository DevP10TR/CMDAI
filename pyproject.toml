[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdai"
version = "1.0.0"
description = "CMDAI - Local AI Runtime, Ollama/OpenAI Server, Hugging Face GGUF Manager, and CMDAI-CODE Controller"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Personal / Non-Commercial"}
dependencies = [
    "textual>=0.70.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "gguf>=0.10.0",
]

[project.scripts]
cmdai = "cmdai.cli:main"

[project.urls]
Homepage = "https://github.com/DevP10TR/CMDAI"
Repository = "https://github.com/DevP10TR/CMDAI"

[tool.setuptools.packages.find]
where = ["src"]
